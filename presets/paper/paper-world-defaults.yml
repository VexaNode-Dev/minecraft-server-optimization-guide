# VexaNode Optimized Paper World Defaults (1.20 - 1.21)
# Balanced for high performance, smooth gameplay, and zero ghost-mob lag
_version: 30
chunks:
  auto-save-interval: 6000
  delay-chunk-unloads-by: 10s
  entity-per-chunk-save-limit:
    arrow: 16
    ender_pearl: 8
    experience_orb: 16
    snowball: 16
  fixed-chunk-inhabited-time: -1
  flush-regions-on-save: false
  max-auto-save-chunks-per-tick: 24
  prevent-moving-into-unloaded-chunks: true

collisions:
  allow-player-cramming-damage: false
  fix-climbing-bypassing-cramming-rule: true
  max-entity-collisions: 2

entities:
  armor-stands:
    do-collision-entity-lookups: false
    tick: false
  behavior:
    disable-chest-cat-detection: true
    spiders-apis-break-sponges: false
  spawning:
    all-chunks-are-slime-chunks: false
    alt-item-despawn-rate:
      enabled: true
      items:
        cobblestone: 300
        netherrack: 300
        sand: 300
        dirt: 300
        gravel: 300
    despawn-ranges:
      ambient:
        hard: 56
        soft: 28
      axolotls:
        hard: 56
        soft: 28
      creature:
        hard: 56
        soft: 28
      misc:
        hard: 56
        soft: 28
      monster:
        hard: 56
        soft: 28
      underground_water_creature:
        hard: 56
        soft: 28
      water_ambient:
        hard: 56
        soft: 28
      water_creature:
        hard: 56
        soft: 28
    non-tick-view-distance: 12
    per-player-mob-spawns: true

tick-rates:
  behavior:
    villager:
      validatenearbypoi: 60
  sensor:
    villager:
      secondarypoisensor: 80
